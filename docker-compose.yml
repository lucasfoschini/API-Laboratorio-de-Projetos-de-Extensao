services:
  db:
    image: postgres:16-alpine
    container_name: labore_ativo_db
    environment:
      POSTGRES_DB: laboratorio_ativo
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: labore_ativo_api
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3333
      DATABASE_URL: postgresql://postgres:postgres@db:5432/laboratorio_ativo?schema=public
      JWT_SECRET: change_me_in_production_use_32_chars_minimum
      JWT_EXPIRES_IN: 1h
      JWT_REFRESH_IN: 7d
      CORS_ORIGIN: https://seu-front.vercel.app
    ports:
      - "3333:3333"

volumes:
  pgdata:
